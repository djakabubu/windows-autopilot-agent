<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title description">
  <title id="title">Mascotte organica animata</title>
  <desc id="description">Una forma ambrata astratta con occhi e un sorriso discreto, animata con movimenti morbidi.</desc>
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4cb70"/>
      <stop offset="0.55" stop-color="#d99a3b"/>
      <stop offset="1" stop-color="#b9702f"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7b553" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#f2c466" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#d18436" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="light" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff0bd" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#fff0bd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .drift {
      transform-box: fill-box;
      transform-origin: center;
      animation: drift 4.8s ease-in-out infinite;
    }
    .flow {
      transform-box: fill-box;
      transform-origin: center;
      animation: flow 6.4s ease-in-out infinite;
    }
    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5.2s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(-0.5deg); }
      50% { transform: translateY(-7px) rotate(0.7deg); }
    }
    @keyframes flow {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      50% { transform: translate(3px, -4px) rotate(1deg); }
    }
    @keyframes blink {
      0%, 91%, 95%, 100% { transform: scaleY(1); }
      93% { transform: scaleY(0.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .drift, .flow, .blink { animation: none; }
    }
  </style>

  <g class="drift">
    <ellipse cx="211" cy="324" rx="74" ry="9" fill="#604b34" opacity="0.12"/>

    <g class="flow">
      <path d="M142 263c8-32 1-67 15-93 13-25 34-41 58-43 25-2 43 12 43 32 0 19-17 33-37 34-18 1-32-7-43 4-13 13-10 37 5 51 18 18 47 17 70 3 21-13 36-36 54-66-8 39-27 75-58 96-33 23-76 25-97 5-11-10-15-22-10-36Z" fill="url(#amber)"/>
      <path d="M178 235c-21 1-44-13-57-33 7 28 24 48 48 55 18 6 36 1 50-8-13-7-23-15-41-14Z" fill="url(#ribbon)"/>
      <path d="M236 174c26-20 45-47 46-73 16 24 9 54-10 76-10 12-24 20-40 23 5-9 7-17 4-26Z" fill="url(#ribbon)"/>
      <path d="M165 179c10-21 28-35 47-39 18-4 34 1 42 13-19-8-38-4-52 8-11 9-17 22-18 36-10-1-17-7-19-18Z" fill="url(#light)"/>
    </g>

    <g class="blink" fill="#332d26">
      <ellipse cx="190" cy="181" rx="4.2" ry="7"/>
      <ellipse cx="220" cy="178" rx="4" ry="6.6"/>
    </g>
    <path d="M184 168c4-3 8-4 12-3" fill="none" stroke="#75532f" stroke-linecap="round" stroke-width="2.4"/>
    <path d="M198 198c5 4 12 4 17-1" fill="none" stroke="#493a2a" stroke-linecap="round" stroke-width="2.6"/>
  </g>
</svg>
