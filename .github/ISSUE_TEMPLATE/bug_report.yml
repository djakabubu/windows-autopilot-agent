name: Bug report
about: Report an issue with the Windows agent
labels: bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary and reproduction steps
      description: Explain the issue and list the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, PowerShell/CMD version, Python version, and agent version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: Remove API keys, tokens, passwords, usernames, and personal paths before posting.
    validations:
      required: false
