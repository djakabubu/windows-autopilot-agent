name: Windows validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile agent
        run: python -m py_compile windows_autopilot.py desktop_backend.py run_gui.pyw tests/test_task_events.py tests/test_desktop_backend.py
      - name: Test task event flow
        run: python -m unittest discover -s tests
      - name: Check CLI version
        run: python windows_autopilot.py --version

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI dependencies
        run: npm ci
      - name: Build React UI
        run: npm run build
      - name: Audit UI dependencies
        run: npm audit
